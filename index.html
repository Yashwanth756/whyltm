<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Universal File Encoder/Decoder</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f5f5f5;
}

.container {
    max-width: 1200px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

textarea {
    width: 100%;
    height: 300px;
    margin-top: 10px;
    font-family: monospace;
}

button {
    padding: 10px 20px;
    margin-top: 10px;
    cursor: pointer;
}

.info {
    background: #eee;
    padding: 10px;
    margin: 10px 0;
}
</style>
</head>

<body>

<div class="container">

<h2>Universal File Encoder / Decoder</h2>

<input type="file" id="fileInput">

<div id="info" class="info"></div>

<h3>Universal Representation (Base64)</h3>
<textarea id="output"></textarea>

<br>

<button id="downloadBtn">
Recreate File
</button>

</div>

<script>

let currentFileName = "";
let currentBase64 = "";

document
.getElementById("fileInput")
.addEventListener("change", async (e) => {

    const file = e.target.files[0];

    if (!file) return;

    currentFileName = file.name;

    document.getElementById("info").innerHTML = `
        <b>Name:</b> ${file.name}<br>
        <b>Type:</b> ${file.type || "Unknown"}<br>
        <b>Size:</b> ${file.size} bytes
    `;

    const arrayBuffer = await file.arrayBuffer();

    const bytes = new Uint8Array(arrayBuffer);

    let binary = "";

    for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
    }

    currentBase64 = btoa(binary);

    document
        .getElementById("output")
        .value = currentBase64;
});

document
.getElementById("downloadBtn")
.addEventListener("click", () => {

    let base64 =
        document
        .getElementById("output")
        .value
        .trim();

    if (!base64) {
        alert("No data");
        return;
    }

    const binary = atob(base64);

    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    const blob = new Blob([bytes]);

    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);

    a.download =
        currentFileName ||
        "restored_file";

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(a.href);
});

</script>

</body>
</html>
